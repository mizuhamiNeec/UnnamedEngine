sensitivity 5

bind esc togglelockcursor

bind v noclip

bind w +forward
bind s +back
bind a +moveleft
bind d +moveright

bind gp_a +jump
bind gp_right_shoulder +jump

bind gp_left_shoulder +duck
bind gp_b +duck
bind gp_right_thumb +duck

bind e +moveup
bind q +movedown

bind ctrl +duck
bind c +duck

bind space +jump

bind mouse1 +attack1
bind mouse2 +attack2

bind r +reload
bind gp_start +reload

bind mwheelup +invprev
bind mwheeldown +invnext

bind f1 toggleeditor

bind 4 +bounds
bind 1 +translate
bind 2 +rotate
bind 3 +scale
bind tab +togglegizmo