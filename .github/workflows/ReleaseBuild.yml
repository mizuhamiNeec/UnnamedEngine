# separate terms of service, privacy policy, and support
# documentation.

name: ReleaseBuild

on:
  pull_request:
    branches:
      - main
    paths:
      - src/**
      - projects/**
      - tools/**
      - build/premake/**
      - premake5.lua
      - .github/workflows/ReleaseBuild.yml
  push:
    branches:
      - main
    paths:
      - src/**
      - projects/**
      - tools/**
      - build/premake/**
      - premake5.lua
      - .github/workflows/ReleaseBuild.yml

env:
  # リポジトリのルートディレクトリを起点としたソリューションファイルのパス
  SOLUTION_FILE_PATH: Unnamed.slnx
  # Visual Studio の構成(Debug / Develop / Release)
  CONFIGURATION: Release
  PLATFORM: x64
  PREMAKE_GAMES: parkour

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup premake
        uses: abel0b/setup-premake@v2.4
        with:
          version: "5.0.0-beta8"
          path: ./

      - name: Show files in the current directory
        shell: pwsh
        run: Get-ChildItem ./

      - name: Generate Visual Studio 2026 project files
        shell: pwsh
        run: .\premake5.exe --games=$env:PREMAKE_GAMES vs2026

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Build
        shell: pwsh
        run: |
          $project = ".\build\projects\UnnamedLauncher\UnnamedLauncher.vcxproj"
          Write-Host "Building shipping target $project ($env:CONFIGURATION|$env:PLATFORM)"
          msbuild $project `
            /m:1 `
            /p:Configuration=$env:CONFIGURATION `
            /p:Platform=$env:PLATFORM
          if ($LASTEXITCODE -ne 0) {
            throw "Build failed: $project (exit=$LASTEXITCODE)"
          }

      - name: Parkour release startup validation
        shell: pwsh
        run: |
          $gameExe = Resolve-Path ".\bin\Release-windows-x86_64\UnnamedLauncher\UnnamedLauncher.exe"
          $project = Resolve-Path ".\projects\ParkourGame\config\game_profile.json"
          Write-Host "Running Parkour startup validation: $gameExe --project=$project --validate-startup-only --disable-audio"
          $valOut = [System.IO.Path]::GetTempFileName()
          $valErr = [System.IO.Path]::GetTempFileName()
          try {
            $gameProcess = Start-Process -FilePath $gameExe -ArgumentList @("--project=$project", "--validate-startup-only", "--disable-audio") -WorkingDirectory $PWD -Wait -PassThru -NoNewWindow -RedirectStandardOutput $valOut -RedirectStandardError $valErr
            $validationText = ((Get-Content -Path $valOut -Raw) + [Environment]::NewLine + (Get-Content -Path $valErr -Raw)).Trim()
            if (-not [string]::IsNullOrWhiteSpace($validationText)) {
              Write-Host $validationText
            }
            if ($gameProcess.ExitCode -ne 0) {
              throw "Parkour startup validation failed (exit=$($gameProcess.ExitCode))"
            }
          } finally {
            if (Test-Path -LiteralPath $valOut) { Remove-Item -LiteralPath $valOut -Force }
            if (Test-Path -LiteralPath $valErr) { Remove-Item -LiteralPath $valErr -Force }
          }

      - name: Parkour release package isolated validation
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\tools\package-game.ps1 `
            -Project .\projects\ParkourGame\config\game_profile.json `
            -AppExePath .\bin\Release-windows-x86_64\UnnamedLauncher\UnnamedLauncher.exe `
            -OutputRoot .\dist\ci-release-parkour `
            -ValidateStartup -ValidateIsolatedStartup -DisableAudio
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged startup validation failed (exit=$LASTEXITCODE)"
          }

      - name: Validate package manifest
        shell: pwsh
        run: |
          $scriptPath = ".\tools\validate-package-manifest.ps1"
          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
            Write-Warning "Optional step skipped: script was not found ($scriptPath)"
            return
          }
          powershell -ExecutionPolicy Bypass -File $scriptPath `
            -ManifestPath .\dist\ci-release-parkour\package_manifest.json `
            -ExpectedGameName Parkour `
            -ExpectedConfiguration Release `
            -RequireGitCommitHash `
            -MinCopiedFiles 80 `
            -MinCopiedBytes 20000000 `
            -RequireStartupValidation `
            -RequireIsolatedValidation
          if ($LASTEXITCODE -ne 0) {
            throw "Package manifest validation failed (exit=$LASTEXITCODE)"
          }

      - name: Generate asset inventory
        shell: pwsh
        run: |
          $scriptPath = ".\tools\generate-asset-inventory.ps1"
          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
            Write-Warning "Optional step skipped: script was not found ($scriptPath)"
            return
          }
          powershell -ExecutionPolicy Bypass -File $scriptPath `
            -ContentRoot .\dist\ci-release-parkour\content `
            -OutputPath .\dist\ci-release-parkour\asset_inventory.json `
            -GameName Parkour `
            -Configuration Release `
            -MountName content `
            -IncludeHash `
            -VerboseSummary
          if ($LASTEXITCODE -ne 0) {
            throw "Asset inventory generation failed (exit=$LASTEXITCODE)"
          }

      - name: Validate asset inventory
        shell: pwsh
        run: |
          $scriptPath = ".\tools\validate-asset-inventory.ps1"
          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
            Write-Warning "Optional step skipped: script was not found ($scriptPath)"
            return
          }
          powershell -ExecutionPolicy Bypass -File $scriptPath `
            -InventoryPath .\dist\ci-release-parkour\asset_inventory.json `
            -ExpectedGameName Parkour `
            -ExpectedConfiguration Release `
            -MinAssets 100 `
            -MinTotalBytes 10000000 `
            -RequireHashes `
            -RequireAssetTypes texture,scene,json,shader,sound,font `
            -MaxUnknownAssets 0
          if ($LASTEXITCODE -ne 0) {
            throw "Asset inventory validation failed (exit=$LASTEXITCODE)"
          }

      - name: Validate asset references
        shell: pwsh
        run: |
          $scriptPath = ".\tools\validate-asset-references.ps1"
          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
            Write-Warning "Optional step skipped: script was not found ($scriptPath)"
            return
          }
          powershell -ExecutionPolicy Bypass -File $scriptPath `
            -ContentRoot .\dist\ci-release-parkour\content `
            -InventoryPath .\dist\ci-release-parkour\asset_inventory.json `
            -OutputPath .\dist\ci-release-parkour\asset_reference_report.json `
            -FailOnMissing `
            -FailOnWarnings `
            -VerboseSummary
          if ($LASTEXITCODE -ne 0) {
            throw "Asset reference validation failed (exit=$LASTEXITCODE)"
          }
