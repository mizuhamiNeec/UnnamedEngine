name: ReleaseBuild

on:
  push:
    branches:
      - main

env:
  # リポジトリのルートディレクトリを起点としたソリューションファイルのパス
  SOLUTION_FILE_PATH: Unnamed.slnx
  # Visual Studio の構成(Debug / Develop / Release)
  CONFIGURATION: Release
  PLATFORM: x64
  PREMAKE_GAMES: none

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup premake
        uses: abel0b/setup-premake@v2.4
        with:
          version: "5.0.0-beta8"
          path: ./

      - name: Show files in the current directory
        shell: pwsh
        run: Get-ChildItem ./

      - name: Generate Visual Studio 2026 project files
        shell: pwsh
        run: .\premake5.exe --games=$env:PREMAKE_GAMES vs2026

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Build
        shell: pwsh
        run: |
          $projects = @(
            ".\build\projects\DirectXTex\DirectXTex.vcxproj",
            ".\build\projects\Lua\Lua.vcxproj",
            ".\build\projects\UnnamedEngineRuntime\UnnamedEngineRuntime.vcxproj",
            ".\build\projects\UnnamedEditorRuntime\UnnamedEditorRuntime.vcxproj",
            ".\build\projects\UnnamedEditorApp\UnnamedEditorApp.vcxproj"
          )

          foreach ($project in $projects) {
            Write-Host "Building $project ($env:CONFIGURATION|$env:PLATFORM)"
            msbuild $project `
              /m:1 `
              /p:Configuration=$env:CONFIGURATION `
              /p:Platform=$env:PLATFORM
            if ($LASTEXITCODE -ne 0) {
              throw "Build failed: $project (exit=$LASTEXITCODE)"
            }
          }

      - name: Engine smoke validation
        shell: pwsh
        run: |
          $editorExe = Resolve-Path ".\bin\Release-windows-x86_64\UnnamedEditorApp\UnnamedEditorApp.exe"
          Write-Host "Running editor help smoke: $editorExe"
          & $editorExe --help
          if ($LASTEXITCODE -ne 0) {
            throw "Editor help smoke failed (exit=$LASTEXITCODE)"
          }
